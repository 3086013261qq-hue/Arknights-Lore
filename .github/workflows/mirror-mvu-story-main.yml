name: mirror-mvu-story-main

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mirror-mvu-story-main.yml'

permissions:
  contents: write

jobs:
  mirror-main-covers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pillow
      - run: python tools/mirror_mvu_story_covers.py --apply --only main
      - name: Mark main covers ready
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('manifest/mvu-story-media.v1.json')
          d=json.loads(p.read_text('utf-8'))
          ready=sum(Path(f'media/mvu/story/main/main-{i:02d}.webp').is_file() for i in range(18))
          d['summary']['binary_ready']=int(ready)
          d['summary']['main_binary_ready']=int(ready)
          d['status']='main-binary-ready-side-pending' if ready==18 else 'main-binary-partial'
          p.write_text(json.dumps(d,ensure_ascii=False,separators=(',',':'))+'\n','utf-8')
          if ready!=18: raise SystemExit(f'expected 18 main covers, got {ready}')
          PY
      - name: Commit mirrored covers
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add media/mvu/story/main QA/mvu-story-media-mirror-report.json manifest/mvu-story-media.v1.json
          git diff --cached --quiet && exit 0
          git commit -m 'media: mirror 18 main story covers'
          git push origin HEAD:main
