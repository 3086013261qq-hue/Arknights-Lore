name: mirror-mvu-story-main

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mirror-mvu-story-main.yml'

permissions:
  contents: write

jobs:
  mirror-main-covers:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow

      - name: Mirror 18 main-story covers from PRTS
        run: python tools/mirror_mvu_story_covers.py --apply --only main

      - name: Mark main covers ready in manifest
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('manifest/mvu-story-media.v1.json')
          data = json.loads(p.read_text('utf-8'))
          ready = sum(1 for i in range(18) if Path(f'media/mvu/story/main/main-{i:02d}.webp').is_file())
          data['summary']['binary_ready'] = ready
          data['summary']['main_binary_ready'] = ready
          data['status'] = 'main-binary-ready-side-pending' if ready == 18 else 'main-binary-partial'
          p.write_text(json.dumps(data, ensure_ascii=False, separators=(',', ':')) + '\n', 'utf-8')
          print('main_binary_ready=', ready)
          if ready != 18:
              raise SystemExit(f'expected 18 main covers, got {ready}')
          PY

      - name: Commit mirrored covers
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add media/mvu/story/main QA/mvu-story-media-mirror-report.json manifest/mvu-story-media.v1.json
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'media: mirror 18 main story covers'
          git push origin HEAD:main
