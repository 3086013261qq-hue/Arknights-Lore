name: audit-mvu-npc-media

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/audit_mvu_npc_media.py'
      - '.github/workflows/audit-mvu-npc-media.yml'

permissions:
  contents: write

jobs:
  audit-npc-portraits:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install audit parser
        run: python -m pip install --disable-pip-version-check beautifulsoup4
      - name: Audit 19 official PRTS story portraits
        run: python tools/audit_mvu_npc_media.py
      - name: Commit audit report and source selections
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add QA/mvu-npc-media-audit-v1.json manifest/npc-media.v1.json
          if git diff --cached --quiet; then
            echo 'No NPC audit changes to commit.'
          else
            git commit -m 'qa: audit 19 NPC portrait sources'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Require complete 19/19 source audit
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('QA/mvu-npc-media-audit-v1.json')
          d=json.loads(p.read_text('utf-8'))
          s=d['summary']
          print('NPC portrait audit:', s)
          selected=int(s.get('selected_for_review',0))
          target=int(s.get('target',19))
          if selected != target:
              unresolved=[x['name'] for x in d['items'] if x.get('status')!='selected-for-review']
              raise SystemExit(f'NPC portrait audit incomplete: {selected}/{target}; unresolved={unresolved}')
          PY
